[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legitfeed"
version = "0.1.0"
description = "Legitimate open-source data collection and ML dataset preparation (RSS/Atom)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LegitFeed Team" }]
dependencies = [
    "requests>=2.31",
    "feedparser>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "SQLAlchemy>=2.0",
    "python-dateutil>=2.8",
    "tenacity>=8.2",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "APScheduler>=3.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]
postgres = ["psycopg2-binary>=2.9"]
browser = ["playwright>=1.42"]

[project.scripts]
legitfeed = "legitfeed.cli:main"

[tool.setuptools.packages.find]
include = ["legitfeed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
