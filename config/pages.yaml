# HTML-страницы для извлечения основного текста (readability-подобно).
# robots.txt проверяется по URL страницы + её сайту.

pages:
  - source_id: peps_python
    url: https://peps.python.org/pep-0008/
    enabled: true
    fixture: tests/fixtures/page_article.html

  - source_id: wikipedia_ml
    url: https://en.wikipedia.org/wiki/Machine_learning
    enabled: true
    fixture: tests/fixtures/page_wiki.html

  # Динамическая страница: рендерится через Playwright (опционально).
  # Если Playwright не установлен — источник попадёт в error (не падает пайплайн).
  - source_id: dynamic_example
    url: https://example.com/app
    render_js: true
    wait_selector: ".app-root"
    enabled: false
